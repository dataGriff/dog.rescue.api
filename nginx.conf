server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Serve the OpenAPI spec (mounted at a separate path to avoid volume conflicts)
    location = /openapi.yaml {
        alias /api/openapi.yaml;
        add_header Content-Type "text/yaml; charset=utf-8";
        add_header Access-Control-Allow-Origin "*";
    }

    # Serve the AsyncAPI spec
    location = /asyncapi.yaml {
        alias /api/asyncapi.yaml;
        add_header Content-Type "text/yaml; charset=utf-8";
        add_header Access-Control-Allow-Origin "*";
    }

    # Serve the docs site
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy       "strict-origin-when-cross-origin";

    gzip            on;
    gzip_types      text/html text/css application/javascript text/plain text/yaml application/json;
    gzip_min_length 256;
}
